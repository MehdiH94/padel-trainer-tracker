name: Ajouter les coachs de démo

# Lancement manuel (onglet Actions › « Ajouter les coachs de démo » › Run workflow).
# Crée sur le serveur les 2 coachs fictifs de backend/seed_more_coaches.py; sans effet s'ils existent déjà.
on:
  workflow_dispatch:

concurrency: deploy

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Créer les coachs fictifs sur le VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$HOST" "cd ~/padel/deploy && docker compose exec -T -e API_URL=http://127.0.0.1:8000/api app python seed_more_coaches.py"

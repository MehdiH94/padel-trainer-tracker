# Tests à chaque push. Le déploiement ne passe plus par ici : l'application
# tourne dans la sandbox de l'usine (VPS), relancée par « usine relancer padel-trainer-tracker ».
name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions


jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  e2e:                      # parcours réels dans un navigateur (Playwright), sur l'application construite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4   # rapport, captures et traces si un parcours échoue
        if: failure()
        with:
          name: rapport-playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

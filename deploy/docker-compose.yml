services:
  app:
    build: ..
    env_file: .env
    volumes:
      - data:/data          # base SQLite (à sauvegarder)
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # certificats HTTPS
    depends_on: [app]
    restart: unless-stopped
volumes:
  data:
  caddy_data:
